apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: azure-vision
  labels: { app.kubernetes.io/part-of: azure-vision }
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, app.kubernetes.io/part-of: azure-vision }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: azure-vision-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-config, mountPath: /etc/nginx/conf.d }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-config, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: azure-vision
spec:
  type: ClusterIP # reach it via `port-forward` (loopback only); see infra/ for the hosted (Container Apps) setup
  selector: { app: web }
  ports:
    - { name: http, port: 8080, targetPort: http }
