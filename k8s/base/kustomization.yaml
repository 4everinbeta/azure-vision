apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: azure-vision
resources:
  - namespace.yaml
  - inventory.yaml
  - cost.yaml
  - layout.yaml
  - web.yaml
configMapGenerator:
  - name: azure-vision
    literals:
      - SOURCE=local
      - AZURE_TENANT_ID=
      - AZURE_CLIENT_ID=
      - CLIENT_IP_HEADER=x-av-client-ip # set by the web gateway (nginx)
